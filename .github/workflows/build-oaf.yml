name: Build OAF kmod

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build for'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583

jobs:
  build-oaf:
    name: Build kmod-oaf (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== open-app-filter location ==="
          ls -la package/feeds/packages/net/open-app-filter/ || true

      - name: Configure
        run: |
          ./scripts/kconfig.pl + "configs/${{ inputs.target }}.config" configs/release.config > .config
          cat configs/oaf.config >> .config
          make defconfig
          echo "=== OAF config entries ==="
          grep -i -E 'oaf|appfilter' .config || echo "(none found)"

      - name: Download sources
        run: make download -j8 || true

      - name: Build host tools
        run: make tools/install -j$(nproc) 2>&1 | tail -40

      - name: Build toolchain
        run: make toolchain/install -j$(nproc) 2>&1 | tail -40

      - name: Wipe kernel module build dirs
        run: |
          rm -rf build_dir/target-*/linux-*/linux-*/net/netfilter build_dir/target-*/open-app-filter-* || true

      - name: Build kmod-oaf
        shell: bash
        run: |
          set -o pipefail
          make package/feeds/packages/open-app-filter/compile V=s -j1 2>&1 | tail -400

      - name: Locate artifacts
        run: |
          echo "=== oaf.ko ==="
          find build_dir -name 'oaf.ko' -exec ls -la {} \; || true
          echo "=== apk/ipk ==="
          find bin -name '*oaf*' -o -name '*appfilter*' | head -20

      - name: Collect artifacts
        run: |
          mkdir -p out
          find build_dir -name 'oaf.ko' -exec cp -v {} out/ \; || true
          find bin \( -name '*oaf*' -o -name '*appfilter*' \) -type f -exec cp -v {} out/ \; || true
          echo "=== collected ==="
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-${{ inputs.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
