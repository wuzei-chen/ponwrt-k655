name: Build OAF kmod

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build for'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583

jobs:
  build-oaf:
    name: Build kmod-oaf (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: oaf-dl-${{ inputs.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            oaf-dl-${{ inputs.target }}-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== OAF feed packages ==="
          ls -la package/feeds/oaf/ || true

      - name: Configure
        run: |
          cp "configs/${{ inputs.target }}.config" .config
          ./scripts/config.pl + configs/release.config >> .config || true
          cat "configs/oaf.config" >> .config
          make defconfig
          echo "=== OAF config entries ==="
          grep -i -E 'oaf|appfilter' .config || echo "(none found)"

      - name: Download sources
        run: make download -j8 || true

      - name: Build kmod-oaf
        run: |
          make package/feeds/oaf/oaf/compile V=s -j$(nproc) 2>&1 | tail -150

      - name: Build appfilter
        run: |
          make package/feeds/oaf/open-app-filter/compile V=s -j$(nproc) 2>&1 | tail -150

      - name: Build luci-app-oaf
        run: |
          make package/feeds/oaf/luci-app-oaf/compile V=s -j$(nproc) 2>&1 | tail -150

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/ -name '*oaf*' -type f -exec cp -v {} out/ \; 2>/dev/null || true
          find bin/ -name '*appfilter*' -type f -exec cp -v {} out/ \; 2>/dev/null || true
          find build_dir -name 'oaf.ko' -exec cp -v {} out/ \; 2>/dev/null || true
          echo "=== collected ==="
          ls -la out/ || echo "(empty)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-${{ inputs.target }}
          path: out/*
          if-no-files-found: warn
          retention-days: 30
